<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新航線公告 - 機票雷達 FareRadar</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #64748b;
    --primary: #4A6CF7;
    --new: #D97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  header a {
    color: var(--primary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px;
  }
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .updated {
    color: var(--muted);
    font-size: 13px;
  }
  .note {
    color: var(--muted);
    font-size: 13px;
    margin: -8px 0 16px;
    line-height: 1.6;
  }
  .group {
    margin-bottom: 20px;
  }
  .group-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-title .count {
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    background: rgba(74, 108, 247, 0.1);
    border-radius: 999px;
    padding: 1px 9px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row-main {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .row-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .route {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .badge-src {
    font-size: 13px;
    padding: 1px 8px;
    border-radius: 999px;
    background: #ECFDF5;
    color: #059669;
  }
  .badge-src.research {
    background: #FFFBEB;
    color: #D97706;
  }
  .meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 13px;
  }
  .meta a {
    color: var(--primary);
    text-decoration: none;
  }
  .meta a:hover {
    text-decoration: underline;
  }
  .btn-delete {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-delete:hover {
    border-color: #DC2626;
    color: #DC2626;
    background: #FEF2F2;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 48px 0;
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>✈️ 新航線公告</h1>
  <a href="./index.html">← 回到機票雷達</a>
</header>
<main>
  <div class="toolbar">
    <select id="airlineFilter">
      <option value="">所有航空公司</option>
    </select>
    <span class="updated" id="updatedAt"></span>
  </div>
  <p class="note">台灣國籍航空（中華航空、長榮航空、星宇航空、台灣虎航）目前公告的國際新航線，含航點、開航日期、每週班次。台灣虎航、星宇航空取自官網公告；中華航空、長榮航空為人工整理彙整。若資料有誤，可點選「刪除」隱藏該筆（僅隱藏於目前瀏覽器）。</p>
  <div id="list"></div>
</main>
<script>
  const DATA_URL = "https://mywu-cloud.github.io/flights/data/routes.json";
  const HIDDEN_KEY = "fareradar_hidden_route_ids";

  const listEl = document.getElementById("list");
  const filterEl = document.getElementById("airlineFilter");
  const updatedEl = document.getElementById("updatedAt");

  let allRoutes = [];

  function getHiddenIds() {
    try {
      return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY) || "[]"));
    } catch (e) {
      return new Set();
    }
  }

  function hideRoute(id) {
    const hidden = getHiddenIds();
    hidden.add(id);
    localStorage.setItem(HIDDEN_KEY, JSON.stringify(Array.from(hidden)));
    render();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDateOnly(raw) {
    if (!raw) return "";
    return String(raw).slice(0, 10);
  }

  function render() {
    const selected = filterEl.value;
    const hidden = getHiddenIds();
    const items = allRoutes.filter((it) => !hidden.has(it.id) && (!selected || it.airline === selected));

    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">尚無符合條件的新航線公告。</div>';
      return;
    }

    const groups = new Map();
    items.forEach((it) => {
      if (!groups.has(it.airline)) groups.set(it.airline, []);
      groups.get(it.airline).push(it);
    });

    let html = "";
    groups.forEach((groupItems, airline) => {
      html += '<div class="group">';
      html += '<div class="group-title">' + escapeHtml(airline) + ' <span class="count">' + groupItems.length + '</span></div>';
      html += '<div class="card">';
      groupItems.forEach((it) => {
        const srcClass = it.source_type === "official" ? "badge-src" : "badge-src research";
        const srcLabel = it.source_type === "official" ? "官網資料" : "網路彙整";
        const sourceLink = it.source_url
          ? '<a href="' + escapeHtml(it.source_url) + '" target="_blank" rel="noopener">資料來源</a>'
          : "";
        html +=
          '<div class="row" data-id="' + escapeHtml(it.id) + '">' +
            '<div class="row-main">' +
              '<span class="route">' + escapeHtml(it.route || "") + '</span>' +
              '<span class="' + srcClass + '">' + srcLabel + '</span>' +
            '</div>' +
            '<div class="row-bottom">' +
              '<div class="meta">' +
                '<span>開航日期：' + escapeHtml(formatDateOnly(it.launch_date) || "未知") + '</span>' +
                '<span>每週班次：' + escapeHtml(it.frequency || "未知") + '</span>' +
                sourceLink +
              '</div>' +
              '<button class="btn-delete" data-delete-id="' + escapeHtml(it.id) + '">刪除</button>' +
            '</div>' +
          '</div>';
      });
      html += '</div></div>';
    });

    listEl.innerHTML = html;

    listEl.querySelectorAll("[data-delete-id]").forEach((btn) => {
      btn.addEventListener("click", () => hideRoute(btn.getAttribute("data-delete-id")));
    });
  }

  fetch(DATA_URL)
    .then((res) => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then((data) => {
      allRoutes = (data.routes || []).slice();
      allRoutes.sort((a, b) => (b.launch_date || "").localeCompare(a.launch_date || ""));

      const airlines = Array.from(new Set(allRoutes.map((it) => it.airline).filter(Boolean)));
      airlines.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        filterEl.appendChild(opt);
      });

      if (data.updated_at) {
        updatedEl.textContent = "最後更新：" + formatDateOnly(data.updated_at);
      }

      render();
    })
    .catch((err) => {
      listEl.innerHTML = '<div class="empty">尚未取得新航線公告資料（' + escapeHtml(err.message) + '）。</div>';
    });

  filterEl.addEventListener("change", render);
</script>
</body>
</html>
